<style>
:root{--night:#0E1B1D;--teal-deep:#123F43;--teal:#1d5a5e;--glow:#4FD1BE;--earth:#2B1B12;--amber:#E8A03A;--sun:#F7D58A;--gold:#C9A24A;--paper:#F4EAD5;--paper-2:#cfc2a8;
--disp:Forum,"Cormorant Garamond",Georgia,serif;--body:"Golos Text",system-ui,sans-serif;--hand:Caveat,cursive;--gut:clamp(16px,4vw,56px);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--paper);font:400 17px/1.62 var(--body);-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:var(--night)}a{color:inherit}:focus-visible{outline:2px solid var(--sun);outline-offset:3px;border-radius:4px}
img{display:block;width:100%;height:auto}h1,h2,h3{font-family:var(--disp);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--gut)}
section{padding:clamp(72px,11vw,150px) 0}
h2{font-size:clamp(2.4rem,6vw,5rem);line-height:1;margin-bottom:.4em}
.kick{font:600 13px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
.hand{font:600 clamp(1.3rem,2.2vw,1.7rem)/1.1 var(--hand);color:var(--sun);margin:.2em 0 0}
.orn{display:block;width:min(420px,70%);margin:48px auto;color:var(--gold);opacity:.8}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 15px var(--body);text-decoration:none;padding:15px 24px;border-radius:999px;background:var(--amber);color:var(--night);border:0;cursor:pointer;transition:transform .2s var(--ease),background .2s}
.btn:hover{transform:translateY(-2px);background:var(--sun)}.btn.ghost{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1.5px rgba(244,234,213,.5)}.btn.ghost:hover{background:rgba(244,234,213,.08)}
/* герой */
.top{position:relative;min-height:100svh;display:grid;align-items:end;overflow:hidden;background:var(--earth)}
.top picture,.top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:20% 40%}@media(max-width:700px){.top img{object-position:46% 30%}}
.top img{animation:drift 30s var(--ease) both}
.top::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,27,29,.15) 0%,rgba(14,27,29,0) 35%,rgba(14,27,29,.6) 70%,var(--night) 100%),linear-gradient(90deg,rgba(43,27,18,.55),rgba(43,27,18,0) 55%)}
.top .in{position:relative;z-index:1;padding:0 var(--gut) clamp(40px,8vh,96px);max-width:1280px;margin:0 auto;width:100%}
.status{display:inline-block;font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--sun);border:1px solid rgba(247,213,138,.45);border-radius:999px;padding:6px 12px;margin-bottom:18px;background:rgba(14,27,29,.35);backdrop-filter:none}
.top h1{font-size:clamp(4.2rem,15vw,12rem);line-height:.86;color:var(--paper);text-shadow:0 6px 40px rgba(14,27,29,.45)}
.top .log{max-width:46ch;font-size:clamp(1.05rem,1.7vw,1.3rem);margin:22px 0 28px;color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:12px}
@keyframes drift{from{transform:scale(1.07)}to{transform:scale(1)}}
/* обещание */
.obs{display:grid;gap:34px}.ob h3{font-size:clamp(2.2rem,4vw,3.4rem);color:var(--amber);line-height:1}.ob p{margin:.5em 0 0;color:var(--paper-2);max-width:36ch}
/* горизонт */
.hz{position:relative;height:230vh;background:var(--night)}
.hz .stage{position:sticky;top:0;height:100svh;overflow:hidden}
.hz .lay{position:absolute;inset:0}.hz .lay img{width:100%;height:100%;object-fit:cover}
.hz .up{clip-path:inset(0 0 calc(var(--p,0)*100%) 0);will-change:clip-path}
.hz .line{position:absolute;left:0;right:0;top:calc((1 - var(--p,0))*100%);height:2px;background:linear-gradient(90deg,transparent,var(--sun),transparent);box-shadow:0 0 24px var(--amber);transform:translateY(-1px)}
.hz .cap{position:absolute;left:var(--gut);bottom:clamp(28px,6vh,64px);right:var(--gut);max-width:640px}
.hz .cap h2{font-size:clamp(2.2rem,5vw,4.2rem);text-shadow:0 4px 30px rgba(0,0,0,.6)}
.hz .cap p{margin:0;color:var(--paper);text-shadow:0 2px 16px rgba(0,0,0,.7)}
.hz .t1,.hz .t2{transition:opacity .4s}.hz .t2{position:absolute;inset:auto 0 0 0;opacity:0}
.hz[data-half="1"] .t1{opacity:0}.hz[data-half="1"] .t2{opacity:1}
/* герои */
.heroes{background:linear-gradient(180deg,var(--night),var(--teal-deep) 50%,var(--night))}
.hero-card{display:grid;gap:26px;padding:clamp(40px,6vw,80px) 0;border-top:1px solid rgba(201,162,74,.25)}
.hero-card h3{font-size:clamp(3rem,7vw,6rem);line-height:.9}
.hero-card dl{margin:24px 0 0;display:grid;grid-template-columns:auto 1fr;gap:12px 20px}
.hero-card dt{font:600 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);padding-top:5px}
.hero-card dd{margin:0;color:var(--paper)}
.shot{display:block;border-radius:14px;overflow:hidden;background:var(--teal-deep);position:relative}
.shot img{transition:transform .7s var(--ease)}.shot:hover img{transform:scale(1.03)}
.shot::after{content:"⤢";position:absolute;right:12px;top:10px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(14,27,29,.6);color:var(--paper);font-size:16px;opacity:0;transition:opacity .2s}
.shot:hover::after,.shot:focus-visible::after{opacity:1}
.emo{display:grid;gap:12px}.emo-pic{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:633/1344;background:var(--teal-deep);max-width:420px}
.emo-pic picture{position:absolute;inset:0;opacity:0;transition:opacity .3s var(--ease)}.emo-pic picture.on{opacity:1}.emo-pic img{height:100%;object-fit:cover}
.emo-btn{display:flex;flex-wrap:wrap;gap:8px}
.emo-btn button{font:500 14px var(--body);color:var(--paper);background:rgba(244,234,213,.06);border:1px solid rgba(244,234,213,.25);border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .2s,color .2s}
.emo-btn button[aria-pressed="true"],.emo-btn button:hover{background:var(--amber);color:var(--night);border-color:var(--amber)}
/* отряд */
.team .big{margin:0 calc(var(--gut)*-1)}
.team ul{list-style:none;padding:0;margin:36px 0 0;display:grid;gap:18px}
.team li{color:var(--paper-2)}.team li b{display:block;font:400 clamp(1.6rem,2.4vw,2rem)/1.1 var(--disp);color:var(--paper)}
.vls{display:grid;gap:30px;margin-top:36px}.vl h3{font-size:clamp(2rem,3.4vw,2.8rem);color:var(--amber)}.vl p{color:var(--paper-2);margin:.4em 0 0}
/* мир */
.world{background:linear-gradient(180deg,var(--night),var(--earth))}
.worlds{list-style:none;padding:0;margin:36px 0 0;display:grid;gap:22px}
.worlds li b{display:block;font:400 1.8rem/1 var(--disp);color:var(--sun)}.worlds li span{color:var(--paper-2)}
.rules{margin:40px 0 0;padding:26px 28px;border:1px solid rgba(79,209,190,.35);border-radius:16px;background:rgba(18,63,67,.35)}
.rules h3{font:600 13px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--glow);margin-bottom:10px}
.rules ol{margin:0;padding-left:20px}.rules li{margin:6px 0}
/* история */
.story{background:var(--earth)}.story .txt p{font-size:clamp(1.1rem,1.6vw,1.3rem);max-width:58ch}.story .txt p.p1::first-letter{font:400 4.2em/.8 var(--disp);float:left;margin:.06em .1em 0 0;color:var(--amber)}
/* кадры */
.mosaic{display:grid;gap:12px;margin-top:30px}
/* язык */
.yzs{display:grid;gap:26px;margin-top:30px}.yz h3{font-size:2rem;color:var(--sun)}.yz p{color:var(--paper-2);margin:.3em 0 0}
.chips{display:flex;margin-top:34px;border-radius:14px;overflow:hidden;height:64px}.chips i{flex:1}
/* сказка */
.src{max-width:70ch;color:var(--paper-2)}
table{width:100%;border-collapse:collapse;margin:28px 0;font-size:15px}
th{font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--amber);text-align:left;padding:10px 12px;border-bottom:1px solid rgba(201,162,74,.4)}
td{padding:14px 12px;border-bottom:1px solid rgba(244,234,213,.12);vertical-align:top;color:var(--paper-2)}td:nth-child(2){color:var(--paper)}
.tl{list-style:none;padding:0;margin:30px 0 0;display:grid;gap:10px}
.tl li{position:relative;padding:14px 16px 14px 104px;border-radius:12px;background:rgba(18,63,67,.45)}
.tl span{position:absolute;left:16px;top:14px;font:600 13px var(--body);color:var(--glow);font-variant-numeric:tabular-nums}
.fin{text-align:center;background:radial-gradient(ellipse at 50% 120%,rgba(232,160,58,.25),transparent 60%),var(--night)}
.fin h2{max-width:16ch;margin:0 auto .4em}.fin p{max-width:52ch;margin:0 auto 28px;color:var(--paper-2)}.fin .row{justify-content:center}
footer{padding:26px var(--gut);font-size:13px;color:var(--paper-2);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid rgba(201,162,74,.2)}footer a{text-decoration:none;color:var(--paper)}
@media(min-width:900px){
 .obs{grid-template-columns:1.2fr 1fr 1fr;gap:48px}.obs .ob:first-child{padding-top:0}.obs .ob:nth-child(2){padding-top:60px}.obs .ob:nth-child(3){padding-top:120px}
 .hero-card{grid-template-columns:1.15fr 1fr;gap:64px;align-items:center}.hero-card:nth-child(even) .hc-media{order:2}
 .team ul{grid-template-columns:repeat(3,1fr);gap:28px 40px}
 .vls{grid-template-columns:1fr 1fr;gap:56px}
 .worlds{grid-template-columns:repeat(4,1fr)}
 .story .wrap{display:grid;grid-template-columns:1fr 1.3fr;gap:64px;align-items:center}
 .mosaic{grid-template-columns:repeat(6,1fr)}.mosaic .m1{grid-column:span 4}.mosaic .m2{grid-column:span 2}.mosaic .m3{grid-column:span 3}.mosaic .m4{grid-column:span 2}.mosaic .m5{grid-column:span 4}
 .mosaic .m2 img,.mosaic .m4 img{height:100%;object-fit:cover}
 .yzs{grid-template-columns:repeat(4,1fr)}
}
/* лайтбокс */
dialog.lb{border:0;padding:0;margin:0;width:100vw;height:100svh;max-width:none;max-height:none;background:transparent;color:var(--paper)}
dialog.lb::backdrop{background:rgb(8 14 15 / .94)}
.lb .fig{position:absolute;inset:56px 0 84px;display:grid;place-items:center;touch-action:pan-y}
.lb .fig img{max-width:min(96vw,1920px);max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px;transition:opacity .25s}
.lb .bar{position:absolute;left:0;right:0;bottom:0;padding:16px var(--gut) 22px;display:flex;gap:16px;align-items:baseline;justify-content:space-between}
.lb .cap{font-size:15px;color:var(--paper)}.lb .cnt{font:600 13px var(--body);color:var(--paper-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb button{position:absolute;border:0;cursor:pointer;color:var(--paper);background:rgba(244,234,213,.1);border-radius:50%;width:52px;height:52px;display:grid;place-items:center;transition:background .2s}
.lb button:hover{background:rgba(244,234,213,.22)}.lb button svg{width:22px;height:22px}
.lb .x{top:12px;right:12px}.lb .pv{left:12px;top:50%;transform:translateY(-50%)}.lb .nx{right:12px;top:50%;transform:translateY(-50%)}
@media(max-width:700px){.lb .pv,.lb .nx{top:auto;bottom:70px;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}.hz{height:auto}.hz .stage{position:relative;height:auto}.hz .up,.hz .line{display:none}.hz .lay.down{position:relative}}
.ver{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(14,27,29,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(244,234,213,.18);font:600 13px 'Golos Text',system-ui,sans-serif;white-space:nowrap;max-width:calc(100vw - 24px)}.ver a{display:block;padding:9px 14px;border-radius:999px;color:#F4EAD5;text-decoration:none;transition:background .2s}.ver a:hover{background:rgba(244,234,213,.12)}.ver a[aria-current=page]{background:#E8A03A;color:#0E1B1D}.ver small{font-weight:500;opacity:.75}@media(max-width:520px){.ver{font-size:12px}.ver a{padding:8px 11px}.ver small{display:none}}@media print{.ver{display:none}}</style>
</head>

<script>
(()=>{const P=JSON.parse(document.getElementById('payload').textContent);const u8=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
async function open(code){const te=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',te.encode(code.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct)));
 document.body.className='';document.body.innerHTML=html;
 document.body.querySelectorAll('script').forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n);});
 try{localStorage.setItem('er-tostik-kod',code.trim().toUpperCase())}catch(e){}
 if(location.hash&&location.hash.length>1){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();}}
const f=document.getElementById('lkf'),i=document.getElementById('lki'),er=document.getElementById('lke');
f.addEventListener('submit',async ev=>{ev.preventDefault();er.textContent='Открываю…';try{await open(i.value)}catch(e){er.textContent='Код не подошёл';i.select();}});
let saved=null;try{saved=localStorage.getItem('er-tostik-kod')}catch(e){}
if(saved){open(saved).catch(()=>{try{localStorage.removeItem('er-tostik-kod')}catch(e){};i.focus()})}else i.focus();})();
</script>
