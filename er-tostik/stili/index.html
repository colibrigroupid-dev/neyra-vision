<meta name="description" content="Ер Төстік — казахская сказка для анимационного фильма: тон, герои, сюжет и семь вариантов визуального стиля.">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Montserrat:wght@600;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{--sky:#0f3b52;--sky-2:#1f6f8b;--air:#eaf3f5;--paper:#f7fafa;--ink:#142433;--ink-2:#3d5466;--sun:#f2a516;--felt:#b4401f;
--disp:Unbounded,system-ui,sans-serif;--kz:Montserrat,system-ui,sans-serif;--body:"Golos Text",system-ui,sans-serif;--gut:clamp(16px,4vw,56px);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
::selection{background:var(--sun);color:var(--ink)}a{color:inherit}:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
img{display:block;width:100%;height:auto}h1,h2,h3,h4{text-wrap:balance;margin:0}
.hero{position:relative;min-height:min(92vh,980px);display:grid;align-items:end;color:#fff;overflow:hidden;background:var(--sky)}
.hero img{position:absolute;inset:0;height:100%;object-fit:cover;object-position:72% 40%;animation:drift 24s var(--ease) both}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,59,82,0) 30%,rgba(15,59,82,.92) 100%),linear-gradient(90deg,rgba(15,59,82,.55),rgba(15,59,82,0) 60%)}
.hero .in{position:relative;z-index:1;padding:0 var(--gut) clamp(32px,7vh,80px);max-width:1200px}
.hero h1{font:800 clamp(3.2rem,11vw,9rem)/.9 var(--kz);letter-spacing:-.04em}
.hero .sub{font:600 clamp(1rem,2vw,1.4rem) var(--disp);color:var(--sun);margin:14px 0 0}
.hero p.l{max-width:46ch;margin:16px 0 24px;color:#e6f1f4}
.btn{display:inline-block;font:600 15px var(--body);text-decoration:none;padding:14px 22px;border-radius:999px;background:var(--sun);color:var(--ink);transition:transform .2s var(--ease)}
.btn:hover{transform:translateY(-2px)}
@keyframes drift{from{transform:scale(1.08)}to{transform:scale(1)}}
section{padding:clamp(56px,9vw,128px) var(--gut)}
.wrap{max-width:1240px;margin:0 auto}
h2{font:800 clamp(1.8rem,4vw,3.2rem)/1.02 var(--disp);letter-spacing:-.03em;margin-bottom:28px;max-width:20ch}
.ton{display:grid;gap:28px}.ton .txt p{margin:0 0 14px;color:var(--ink-2);max-width:62ch}.ton .txt p:first-child{font-size:21px;color:var(--ink);font-weight:500}
.geroi{display:grid;gap:18px;margin-top:40px}
.g{background:#fff;border-radius:14px;padding:22px 22px 8px;border:1px solid #d6e3e7}
.g h4{font:700 19px var(--kz);margin-bottom:8px;color:var(--sky)}.g p{color:var(--ink-2);margin:0 0 14px}
.syu{background:var(--air)}
ol.beats{list-style:none;padding:0;margin:0;display:grid;gap:4px;counter-reset:b}
ol.beats li{counter-increment:b;display:grid;grid-template-columns:56px 1fr;gap:4px 16px;padding:18px 0;border-top:1px solid #c9dadf}
ol.beats li::before{content:counter(b);grid-row:span 2;font:800 30px/1 var(--disp);color:var(--sun)}
ol.beats h4{font:700 17px var(--disp)}ol.beats p{margin:0;color:var(--ink-2)}

.smysl{display:grid;gap:26px}.sm h4{font:700 19px var(--disp);margin-bottom:6px}.sm p{margin:0;color:var(--ink-2)}
@media(min-width:900px){.smysl{grid-template-columns:repeat(3,1fr);gap:40px}}
ul.miry{margin:32px 0 0;padding-left:20px;color:var(--ink-2)}ul.miry .src{list-style:none;margin-left:-20px;margin-top:14px;font-size:14px}ul.miry li{margin:6px 0}ul.miry b{color:var(--ink)}
.cmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cmp a{position:relative;display:block;border-radius:10px;overflow:hidden;text-decoration:none}
.cmp img{aspect-ratio:16/9;object-fit:cover;transition:transform .5s var(--ease)}.cmp a:hover img{transform:scale(1.04)}
.cmp span{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;color:#fff;font:500 14px var(--body);background:linear-gradient(0deg,rgba(15,59,82,.9),transparent)}
.cmp b{font:800 16px var(--disp);color:var(--sun);margin-right:6px}
.stl{padding:clamp(48px,7vw,96px) 0;border-top:1px solid #d6e3e7}
.sh{display:flex;gap:18px;align-items:center;margin-bottom:22px}
.let{font:800 clamp(3.4rem,7vw,5.5rem)/1 var(--disp);color:var(--sun);margin:0;letter-spacing:-.04em}
.sh h3{font:800 clamp(1.6rem,3.4vw,2.6rem)/1.05 var(--disp);letter-spacing:-.025em}.short{margin:6px 0 0;font-weight:600;color:var(--felt);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;gap:10px}
figure{margin:0}figure a{display:block;border-radius:10px;overflow:hidden;background:var(--air)}
figure img{aspect-ratio:16/9;object-fit:cover;transition:transform .6s var(--ease)}figure a:hover img{transform:scale(1.03)}
figcaption{font-size:13px;color:var(--ink-2);margin-top:6px}
.about{display:grid;gap:18px;margin-top:22px}.ref{font-size:19px;margin:0;max-width:60ch}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}dt{font:700 13px var(--disp);color:var(--felt);padding-top:3px}dd{margin:0;color:var(--ink-2)}
@media(min-width:900px){
 .ton{grid-template-columns:1fr 1.4fr;gap:64px}.geroi{grid-template-columns:repeat(2,1fr)}
 ol.beats{grid-template-columns:1fr 1fr;column-gap:56px}
 .grid{grid-template-columns:2fr 1fr;grid-template-rows:auto auto}.grid .big{grid-row:span 2}
 .about{grid-template-columns:1.2fr 1fr;gap:56px}
}
.end{background:var(--sky);color:#fff}.end h2{color:#fff}.end ol{max-width:60ch;color:#d4e6ec;padding-left:22px}.end li{margin:8px 0}
.end .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.ghost{background:transparent;border:2px solid #fff;color:#fff}
footer{background:#0b2c3d;color:#9fbccb;padding:22px var(--gut);font-size:13px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}footer a{color:#d4e6ec;text-decoration:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.ver{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(14,27,29,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 6px 24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(244,234,213,.18);font:600 13px 'Golos Text',system-ui,sans-serif;white-space:nowrap;max-width:calc(100vw - 24px)}.ver a{display:block;padding:9px 14px;border-radius:999px;color:#F4EAD5;text-decoration:none;transition:background .2s}.ver a:hover{background:rgba(244,234,213,.12)}.ver a[aria-current=page]{background:#E8A03A;color:#0E1B1D}.ver small{font-weight:500;opacity:.75}@media(max-width:520px){.ver{font-size:12px}.ver a{padding:8px 11px}.ver small{display:none}}@media print{.ver{display:none}}.ver .thm{font:inherit;color:#F4EAD5;background:transparent;border:0;border-left:1px solid rgba(244,234,213,.2);border-radius:0 999px 999px 0;padding:9px 14px;cursor:pointer;transition:background .2s}.ver .thm:hover{background:rgba(244,234,213,.12)}@media(max-width:520px){.ver .thm{padding:8px 10px}}html{transition:background-color .4s}body{transition:background-color .4s,color .4s}html[data-theme=evening]{--paper:#0E1A21;--air:#152C36;--ink:#EAF1F3;--ink-2:#A8BCC6;--sky-2:#7cc3da;--felt:#E58A63}html[data-theme=evening] .g{background:#13252e;border-color:#25404c}html[data-theme=evening] .stl,html[data-theme=evening] ol.beats li{border-top-color:#25404c}html[data-theme=evening] .syu{background:#112630}html[data-theme=evening] .g h4{color:#7cc3da}</style>
</head>

<script>
(()=>{const P=JSON.parse(document.getElementById('payload').textContent);const u8=s=>Uint8Array.from(atob(s),x=>x.charCodeAt(0));
async function open(code){const te=new TextEncoder();
 const km=await crypto.subtle.importKey('raw',te.encode(code.trim().toUpperCase()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.salt),iterations:P.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.iv)},key,u8(P.ct)));
 document.body.className='';document.body.innerHTML=html;
 document.body.querySelectorAll('script').forEach(s=>{const n=document.createElement('script');n.textContent=s.textContent;s.replaceWith(n);});
 try{localStorage.setItem('er-tostik-kod',code.trim().toUpperCase())}catch(e){}
 if(location.hash&&location.hash.length>1){const t=document.getElementById(location.hash.slice(1));if(t)t.scrollIntoView();}}
const f=document.getElementById('lkf'),i=document.getElementById('lki'),er=document.getElementById('lke');
f.addEventListener('submit',async ev=>{ev.preventDefault();er.textContent='Открываю…';try{await open(i.value)}catch(e){er.textContent='Код не подошёл';i.select();}});
let saved=null;try{saved=localStorage.getItem('er-tostik-kod')}catch(e){}
if(saved){open(saved).catch(()=>{try{localStorage.removeItem('er-tostik-kod')}catch(e){};i.focus()})}else i.focus();})();
</script>
