<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05080b"><title>ОРДА · станция, сц. 9 · 3D</title><style>
:root{--bg:#14110e;--panel:#1f1a15;--line:#3a3128;--ink:#efe6d8;--mute:#a8998a;--gold:#d9a441;--red:#c4553d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 6px}
h1{font-size:18px;margin:0}
.sub{color:var(--mute);font-size:13px}
#wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;padding:8px 16px 16px}
@media(max-width:900px){#wrap{grid-template-columns:1fr}}
#views{display:flex;flex-direction:column;gap:8px;min-width:0}
.vlabel{font-size:12px;color:var(--mute);margin:2px 0}
#shotView,#topView{width:100%;display:block;border-radius:8px;background:#000}
#shotView{aspect-ratio:2.39/1}
#topView{aspect-ratio:16/9}
#bar{display:flex;align-items:center;gap:10px;margin-top:4px}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--gold)}
#time{font-variant-numeric:tabular-nums;color:var(--mute);min-width:70px}
#tl{position:relative;height:38px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;flex:1}
.blk{position:absolute;top:0;bottom:0;border-right:1px solid var(--bg);font-size:11px;padding:3px 4px;color:var(--mute);overflow:hidden;white-space:nowrap}
.blk.on{background:#3b2f1f;color:var(--ink)}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--gold)}
#sub{min-height:44px;padding:8px 12px;background:#000;border-radius:8px;text-align:center;font-size:16px}
aside{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card h2{font-size:14px;margin:0 0 6px;color:var(--gold)}
.k{color:var(--mute)}
#shotCard b{color:var(--ink)}
ol{margin:0;padding-left:18px}
li{margin:3px 0}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;border:1px solid var(--gold);color:var(--gold);font-size:12px}
.leg span{display:inline-flex;align-items:center;gap:5px;margin-right:10px;font-size:12px}
.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}
#screen{position:relative}
#shotView{filter:contrast(1.06) saturate(.88) sepia(.12) brightness(1.02)}
#screen::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
#tag{display:none;position:absolute;top:8px;left:10px;font:12px/1.3 ui-monospace,Menlo,monospace;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-radius:4px}
body.anim header,body.anim aside,body.anim #topView,body.anim .vlabel,body.anim .leg{display:none}
body.anim{background:#000}
body.anim #wrap{grid-template-columns:1fr;padding:0;gap:0}
body.anim #shotView{border-radius:0}
body.anim #tag{display:block}
body.anim #sub{position:absolute;left:0;right:0;bottom:46px;background:transparent;font-size:20px;color:#fff;text-shadow:0 1px 3px #000,0 0 8px #000;pointer-events:none}
body.anim #bar{position:fixed;left:0;right:0;bottom:0;padding:6px 10px;background:rgba(0,0,0,.6);margin:0}
body.anim #views{position:relative;justify-content:center;min-height:100vh}

#gate{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#05080b;color:#e9eef1;font:16px/1.5 -apple-system,"Helvetica Neue",Arial,sans-serif}#gate form{text-align:center;max-width:340px;padding:16px}
#gate h1{font-size:20px;margin:0}#gate p{color:#8d99a3;margin:6px 0 0}#gate input{font:inherit;font-size:18px;padding:10px 14px;border-radius:10px;border:1px solid #1d2731;background:#0b1016;color:#e9eef1;text-align:center;letter-spacing:.12em;width:100%;margin:14px 0 8px}
#gate button{font:inherit;font-weight:600;padding:10px 22px;border-radius:999px;border:0;background:#5fd8e6;color:#05080b;cursor:pointer}#gerr{color:#e08a7a;min-height:1.4em}
#vseback{position:fixed;z-index:50;left:12px;bottom:12px;padding:7px 12px;border-radius:999px;background:rgba(16,13,10,.82);color:#e9eef1;font:600 13px -apple-system,Arial,sans-serif;text-decoration:none;border:1px solid #1d2731}#vseback:hover{border-color:#5fd8e6}</style></head>
