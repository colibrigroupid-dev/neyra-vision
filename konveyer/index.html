<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конвейер кадра — Neyra Vision</title>
<meta name="description" content="Как мы делаем кадр: тест 480p, чистовой 1080p, мастер 4K.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1B1D">
<link rel="icon" type="image/png" href="../assets/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Golos+Text:wght@400;500;600&display=swap">
<style>
:root{--bg:#0E1B1D;--bg2:#13262a;--line:rgba(244,234,213,.14);--ink:#F4EAD5;--ink2:#cfc2a8;--gold:#E8A03A;--gold2:#F7D58A;--cyan:#5fd3d0;--disp:"Forum",Georgia,serif;--body:"Golos Text",system-ui,sans-serif;--gut:clamp(16px,4vw,40px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 var(--gut)}
header{padding:28px 0 0}
.brand{font:600 13px var(--body);letter-spacing:.08em;text-decoration:none;color:var(--ink2);text-transform:uppercase}
h1{font:400 clamp(2.4rem,7vw,4rem)/1.05 var(--disp);margin:36px 0 10px;text-wrap:balance}
.lead{font-size:clamp(17px,2.2vw,20px);color:var(--ink2);max-width:40em;margin:0 0 32px}
.steps{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(min-width:760px){.steps{grid-template-columns:repeat(4,1fr)}}
.st{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg2);display:flex;flex-direction:column;gap:2px}
.st b{font:400 2rem/1 var(--disp);color:var(--gold)}
.st span{font-weight:600}
.st em{font-style:normal;font-size:13px;color:var(--ink2)}
section{padding:36px 0 0;border-top:1px solid var(--line);margin-top:36px}
h3{font:400 1.6rem/1.15 var(--disp);margin:0 0 12px;display:flex;align-items:center;gap:12px}
h4{font:600 16px var(--body);margin:28px 0 8px}
.n{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--bg);font:400 1.3rem var(--disp)}
.meta{font-size:14px;color:var(--cyan);margin:0 0 10px}
p{margin:0 0 12px}
ul{padding-left:1.2em;margin:0}
li{margin:0 0 6px}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:2.35;display:block;margin:6px 0 12px}
.frames{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:640px){.frames{grid-template-columns:repeat(3,1fr)}}
@media(min-width:640px){.frames.four{grid-template-columns:repeat(4,1fr)}}
figure{margin:0}
figure img{width:100%;border-radius:10px;display:block}
figcaption{font-size:13px;color:var(--ink2);margin-top:4px}
code,pre{font:500 13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}
pre{background:#0a1416;border:1px solid var(--line);border-radius:12px;padding:16px;overflow:auto;white-space:pre-wrap;color:var(--ink);margin:0}
.cp{margin:8px 0 6px;font:600 14px var(--body);padding:8px 16px;border-radius:999px;border:1px solid rgba(244,234,213,.35);background:transparent;color:var(--ink);cursor:pointer}
.cp:hover{border-color:var(--gold);color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 12px;display:block;overflow-x:auto}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--ink2);font-weight:500}
td code{font-size:12.5px;color:var(--gold2)}
.docs{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:720px){.docs{grid-template-columns:1fr 1fr}}
.doc{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--bg2);display:flex;flex-direction:column;gap:4px}
.doc span{font-size:14px;color:var(--ink2)}
.dl{margin-top:8px;align-self:flex-start;font:600 14px var(--body);padding:9px 16px;border-radius:999px;border:0;background:var(--gold);color:var(--bg);cursor:pointer}
.dl:hover{background:var(--gold2)}
footer{padding:40px 0 48px;color:var(--ink2);font-size:14px;border-top:1px solid var(--line);margin-top:40px}
#lock{min-height:60vh;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:420px}
#lock input{font:500 18px var(--body);padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);letter-spacing:.1em;text-transform:uppercase}
#lock button{font:600 16px var(--body);padding:14px;border-radius:999px;border:0;background:var(--gold);color:var(--bg);cursor:pointer}
#err{color:#e98a7a;font-size:14px;min-height:1.2em}
</style>
</head>

<script>
(()=>{
const P=JSON.parse(document.getElementById('payload').textContent);
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function key(code){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.s),iterations:P.i,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
}
async function open(code,save){
  const k=await key(code);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},k,ub(P.ct)));
  try{save&&localStorage.setItem('nv_konveyer',code)}catch(e){}
  document.getElementById('lock').remove();
  const app=document.getElementById('app');app.innerHTML=html;app.hidden=false;
  app.querySelectorAll('.cp').forEach(b=>b.onclick=()=>{
    const t=b.previousElementSibling.textContent;
    navigator.clipboard.writeText(t).then(()=>{b.textContent='Скопировано';setTimeout(()=>b.textContent='Копировать',1500)});
  });
  app.querySelectorAll('.dl').forEach(b=>b.onclick=async()=>{
    const n=b.dataset.doc;
    const r=await fetch('docs/'+n+'.bin');
    const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.docs[n])},k,await r.arrayBuffer());
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/markdown'}));a.download=n+'.md';a.click();
  });
  try{
    const r=await fetch('v.bin');const v=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.viv)},k,await r.arrayBuffer());
    document.getElementById('refv').src=URL.createObjectURL(new Blob([v],{type:'video/mp4'}));
  }catch(e){document.getElementById('refv').remove()}
}
document.getElementById('lock').onsubmit=async e=>{
  e.preventDefault();
  const c=document.getElementById('code').value.trim().toUpperCase();
  try{await open(c,true)}catch(x){document.getElementById('err').textContent='Код не подходит'}
};
let saved=null;try{saved=localStorage.getItem('nv_konveyer')}catch(e){}
if(saved)open(saved,false).catch(()=>{});
})();
</script>
